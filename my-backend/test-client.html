<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WebSocket Connection Test</title>
</head>
<body>
  <h2>WebSocket Connection Test</h2>
  <p id="status">Connecting to backend...</p>
  <button onclick="sendPing()">Send Test Message</button>

  <!-- Socket.io CDN script -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    const socket = io('https://pebble-mocker-sleet.ngrok-free.dev', {
      transports: ['websocket', 'polling']
    });

    const statusEl = document.getElementById('status');

    socket.on('connect', () => {
      statusEl.innerText = 'Connected to backend successfully! ID: ' + socket.id;
    });

    socket.on('disconnect', () => {
      statusEl.innerText = 'Disconnected from backend.';
    });

    function sendPing() {
      socket.emit('events', 'Hello from test client!');
    }
  </script>
</body>
</html>
